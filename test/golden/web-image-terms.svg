<svg xmlns="http://www.w3.org/2000/svg" class="mem-diagram" viewBox="0 0 700 921" style="--diagram-width:700" font-family="code-mono, hangul-sans, monospace" font-weight="700" role="img" aria-label="The image files a website serves, where each one shows up, and which of them this site has">
